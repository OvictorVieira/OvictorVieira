# Reference: https://github.com/lowlighter/metrics/blob/master/action.yml
name: Metrics

on:
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # Overview: profile header, activity counters, community stats, calendar
      - name: Overview
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics/overview.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: OvictorVieira
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          repositories_affiliations: owner, collaborator, organization_member
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 100

      # Languages: most used languages across public and private repositories
      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: OvictorVieira
          base: ""
          config_timezone: America/Sao_Paulo
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, scss, dockerfile, makefile, shell, hcl, batchfile,
            procfile, gherkin, jupyter notebook
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%
          plugin_languages_details: bytes-size, percentage
